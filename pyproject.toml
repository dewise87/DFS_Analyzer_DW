[project]
name = "narrative-alpha"
version = "0.1.0"
description = "NFL DFS decision engine for context, field behavior, and uncertainty"
authors = [{ name = "Daniel Wise", email = "dewise87@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.3,<2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=2.0",
    "polars>=1.0",
    "pyyaml>=6.0",
    "pydfs-lineup-optimizer==3.6.1",
    "rapidfuzz>=3.9",
    "scipy>=1.14",
    "mcp>=1.9,<2",
]

[project.scripts]
na-build = "narrative_alpha.build_cli:main"
na-collect = "narrative_alpha.collect_cli:main"
na-contest = "narrative_alpha.contest_cli:main"
na-crosswalk = "narrative_alpha.identity.cli:main"
na-episodes = "narrative_alpha.episodes_cli:main"
na-extract = "narrative_alpha.extract_cli:main"
na-fast = "narrative_alpha.fast.cli:main"
na-features = "narrative_alpha.features_cli:main"
na-mcp = "narrative_alpha.mcp_server:main"
na-ops = "narrative_alpha.ops.cli:main"
na-ownership = "narrative_alpha.ownership.cli:main"
na-report = "narrative_alpha.report_cli:main"
na-slate = "narrative_alpha.slate_cli:main"
na-replay = "narrative_alpha.replay_cli:main"
na-snapshot = "narrative_alpha.snapshots.cli:main"
na-simulate = "narrative_alpha.simulation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_alpha"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["narrative_alpha"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
