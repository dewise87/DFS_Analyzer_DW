[project]
name = "narrative-alpha"
version = "0.1.0"
description = "NFL DFS decision engine for context, field behavior, and uncertainty"
authors = [{ name = "Daniel Wise", email = "dewise87@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "polars>=1.0",
    "pyyaml>=6.0",
    "pydfs-lineup-optimizer==3.6.1",
    "rapidfuzz>=3.9",
]

[project.scripts]
na-build = "narrative_alpha.build_cli:main"
na-contest = "narrative_alpha.contest_cli:main"
na-crosswalk = "narrative_alpha.identity.cli:main"
na-replay = "narrative_alpha.replay_cli:main"
na-snapshot = "narrative_alpha.snapshots.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_alpha"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["narrative_alpha"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
