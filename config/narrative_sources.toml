# NFL narrative feed catalog — candidate sources for `na-collect seed`.
#
# Every feed_url below returned a valid RSS/Atom document when this file was generated
# (2026-09-01). Nothing here is a reviewed rights decision: `terms_reviewed_at` is
# deliberately absent, and seeding requires the operator to pass one explicitly. The
# policy_tier only proposes retention/permission defaults for that review to accept or
# change.
#
# Individual beat reporters are intentionally absent: they publish at outlets and post on
# X, and almost none run a personal feed. The per-team outlet feeds below are where their
# reporting actually becomes machine-readable. See docs/DECISIONS.md for the X/Bluesky call.

[policy_tiers.official_team]
permitted_use = "internal_analysis_only"
raw_retention_days = 30
personal_data_fields_allowed = []
must_honor_deletions = true
redistribution_allowed = false
third_party_processing_allowed = true
commercial_use_status = "unreviewed_assume_prohibited"

[policy_tiers.national_media]
permitted_use = "internal_analysis_only"
raw_retention_days = 14
personal_data_fields_allowed = []
must_honor_deletions = true
redistribution_allowed = false
third_party_processing_allowed = true
commercial_use_status = "unreviewed_assume_prohibited"

[policy_tiers.team_blog]
permitted_use = "internal_analysis_only"
raw_retention_days = 14
personal_data_fields_allowed = []
must_honor_deletions = true
redistribution_allowed = false
third_party_processing_allowed = true
commercial_use_status = "unreviewed_assume_prohibited"

[policy_tiers.fantasy_aggregator]
permitted_use = "internal_analysis_only"
raw_retention_days = 14
personal_data_fields_allowed = []
must_honor_deletions = true
redistribution_allowed = false
third_party_processing_allowed = true
commercial_use_status = "unreviewed_assume_prohibited"

